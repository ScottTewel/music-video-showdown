<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Music Video Showdown</title>
<meta name="description" content="Pick the music videos, watch them together, vote for the best. A party game for people who grew up on music videos.">
<meta name="theme-color" content="#17113a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Music Video Showdown">
<meta property="og:title" content="Music Video Showdown">
<meta property="og:description" content="Pick the videos. Watch them together. Vote for the best. Add your songs before the party.">
<meta property="og:url" content="https://scotttewel.github.io/music-video-showdown/">
<meta property="og:image" content="https://scotttewel.github.io/music-video-showdown/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A hot pink retro TV showing the words Music Video Showdown">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://scotttewel.github.io/music-video-showdown/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{
  /* late-night music video channel: CRT indigo, hot pink set, highlighter yellow, electric cyan */
  --bg:#17113a; --panel:#211a4f; --panel2:#2c2363; --line:#41378a;
  --text:#fbf6ff; --muted:#bdb4e2; --gold:#ffd23f; --gold-ink:#17113a;
  --pink:#ff3d9a; --cyan:#3ee8ff; --lime:#9dff6b;
  --blue:#3ee8ff; --red:#ff5d7a; --green:#9dff6b;
  --display:"Bungee", "Archivo", system-ui, sans-serif;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 2px, transparent 2px 5px),
  radial-gradient(800px 520px at 15% -10%, rgba(91,60,255,.45), transparent 65%),
  radial-gradient(700px 500px at 110% 110%, rgba(255,61,154,.16), transparent 60%), var(--bg);
  background-attachment:fixed}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;font-weight:800;letter-spacing:-.015em;margin:0}
.display{font-family:var(--display);font-weight:400;letter-spacing:0}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--panel2);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-red{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn-sm{padding:7px 11px;font-size:14px;border-radius:9px}
input,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:16px 0 6px}
a{color:var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 100px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.hidden{display:none!important}
.brand{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
.brand .logo{width:42px;height:42px;flex:none;display:block}
.brand h1{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.05;letter-spacing:0}
.brand .sub{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);margin:0 6px 8px 0;font-weight:500}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(23,17,58,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:10}
.tabs button{flex:1;background:transparent;color:var(--muted);padding:10px 4px;position:relative}
.tabs button.on{color:var(--text);background:var(--panel2)}
.dot{position:absolute;top:6px;right:calc(50% - 34px);width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,93,122,.25);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
.thumb{width:112px;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:#000;flex:none}
.item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--panel2);border:2px solid transparent;margin-bottom:10px;text-align:left;width:100%}
.item .t{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.picked{border-color:var(--gold);background:rgba(255,210,63,.13)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px}
.item.picked .check{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px}
.cat-head h3{font-size:17px}
.preview{display:flex;gap:12px;align-items:center;margin-top:12px}
.empty{text-align:center;padding:40px 10px}
.empty .big{font-size:48px}
.score-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--panel2);margin-bottom:8px}
.score-row .rank{width:28px;font-family:var(--display);font-weight:400;color:var(--muted)}
.score-row .pts{font-family:var(--display);font-weight:400;font-size:20px}
.score-row.first{background:rgba(255,210,63,.13);border:1px solid var(--gold)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--muted)}
.badge.live{background:var(--red);color:#fff}
.badge.done{background:rgba(157,255,107,.14);color:var(--green)}

/* DJ */
.dj{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:18px;background:rgba(0,0,0,.2);overflow:auto;max-height:100vh;position:sticky;top:0}
.side .catbtn{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin-bottom:6px;background:transparent;padding:10px 12px;font-weight:500}
.side .catbtn.on{background:var(--panel2)}
.main{padding:24px 28px;max-width:1100px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.vcard .body{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:8px}
.vcard .t{font-weight:600;line-height:1.25}
.vcard.played{opacity:.55}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stage{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.stage iframe{flex:1;border:0;width:100%}
.stagebar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#0c0a09;border-top:1px solid #222}
.screen{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:4vh 5vw;display:flex;flex-direction:column}
.screen .kicker{color:var(--gold);font-weight:800;font-size:clamp(16px,1.8vw,26px)}
.screen h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,5.5vw,84px);line-height:1;text-shadow:-3px 0 0 var(--pink),3px 0 0 var(--cyan)}
.vote-layout{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;flex:1}
.qr{background:#fff;padding:16px;border-radius:18px;width:clamp(200px,24vw,360px)}
.qr img,.qr canvas,.qr svg{width:100%;height:auto;display:block}
.bignum{font-family:var(--display);font-weight:400;font-size:clamp(60px,10vw,160px);line-height:1;color:var(--gold)}
.podium{display:grid;gap:2vh;margin-top:4vh}
.pod{display:flex;gap:2vw;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:2vh 2vw}
.pod img{width:clamp(140px,18vw,280px);aspect-ratio:16/9;object-fit:cover;border-radius:12px}
.pod .place{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.5vw,64px);width:2.2em;color:var(--muted)}
.pod.p1{border-color:var(--gold);background:rgba(255,210,63,.12)}
.pod.p1 .place{color:var(--gold)}
.pod .t{font-size:clamp(18px,2vw,30px);font-weight:600}
.pod .team{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.6vw,40px)}
.pod .pts{margin-left:auto;font-family:var(--display);font-weight:400;font-size:clamp(26px,3vw,46px);color:var(--gold)}
.screen .score-row{font-size:clamp(18px,2vw,30px);padding:1.4vh 1.6vw}
.screen .score-row .pts{font-size:clamp(22px,2.6vw,40px)}
.screen-close{position:fixed;top:14px;right:14px;z-index:60}
@media (max-width:820px){.dj{grid-template-columns:1fr}.side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.vote-layout{grid-template-columns:1fr}}

/* ---------- front page: the TV ---------- */
.hero{padding-top:30px}
.tv{position:relative;background:var(--pink);border-radius:30px;padding:14px 62px 14px 14px;box-shadow:0 0 0 4px var(--bg),9px 9px 0 4px var(--gold)}
.tv .ant{position:absolute;top:-34px;width:7px;height:50px;border-radius:5px;background:var(--gold);transform-origin:bottom center}
.tv .ant.l{left:30%;transform:rotate(-36deg)}
.tv .ant.r{left:58%;transform:rotate(36deg)}
.tv .knob{position:absolute;right:15px;width:32px;height:32px;border-radius:50%;background:var(--bg);box-shadow:inset -4px -4px 0 rgba(255,255,255,.14)}
.tv .knob.a{top:26px}.tv .knob.b{top:70px}
.tv .grille{position:absolute;right:15px;bottom:22px;width:32px;height:56px;background:repeating-linear-gradient(0deg,var(--bg) 0 4px,transparent 4px 9px);opacity:.55}
.tv-screen{position:relative;container-type:inline-size;aspect-ratio:5/4;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 90% at 40% 30%,#2e2283 0,#120c36 72%);box-shadow:inset 0 0 40px rgba(62,232,255,.35)}
.tv-screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 2px,transparent 2px 4px)}
.tv-on{position:absolute;inset:0;transform-origin:center;animation:tvOn .9s cubic-bezier(.2,.7,.2,1) .15s both}
@keyframes tvOn{0%{transform:scale(1,.004);filter:brightness(4)}45%{transform:scale(1,.004);filter:brightness(4)}75%{transform:scale(1,1.04);filter:brightness(1.6)}100%{transform:none;filter:none}}
.tv-on.still{animation:none}
@media (prefers-reduced-motion:reduce){.tv-on{animation:none}}
.wordmark{position:absolute;left:8cqw;top:8cqw;margin:0;font-family:var(--display);font-weight:400;font-size:12.6cqw;line-height:.92;color:#fff;letter-spacing:0;
  text-shadow:-.045em 0 0 var(--pink),.045em 0 0 var(--cyan)}
.credit{position:absolute;left:8cqw;bottom:7cqw;margin:0;font-size:max(12px,4.3cqw);line-height:1.3;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.7);z-index:1}
.credit b{font-weight:800}
.lede{font-size:18px;line-height:1.5;margin:30px 0 0;max-width:34em}
.join{margin-top:22px;border-color:var(--gold)}
.join h2{font-size:22px}
.how{margin-top:34px}
.how h2,.shelf h2{font-size:20px;margin-bottom:12px}
.how ol{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:step}
.how li{counter-increment:step;display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.how li::before{content:counter(step);font-family:var(--display);font-size:22px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--gold);border:2px solid var(--line)}
.how b{display:block;font-size:17px}
.how p{margin:2px 0 0;color:var(--muted)}
.shelf{margin-top:34px}
.tape{position:relative;display:block;border-radius:6px;padding:11px 64px 11px 16px;margin-bottom:10px;color:var(--gold-ink);box-shadow:5px 5px 0 #0b0726}
.tape b{display:block;font-size:17px;line-height:1.2}
.tape span{display:block;font-size:14px;opacity:.82;line-height:1.35}
.tape::after{content:"";position:absolute;right:16px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;border:5px solid rgba(23,17,58,.32)}
.tape:nth-of-type(5n+1){background:var(--gold)}
.tape:nth-of-type(5n+2){background:var(--cyan)}
.tape:nth-of-type(5n+3){background:#fbf6ff}
.tape:nth-of-type(5n+4){background:var(--pink);color:#fff}
.tape:nth-of-type(5n+5){background:var(--lime)}
.tape:nth-of-type(5n+4)::after{border-color:rgba(255,255,255,.4)}
.foot{margin-top:28px;text-align:center;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const SUPABASE_URL = "https://ftqjtfzaqgzwtlhwkvee.supabase.co";
const SUPABASE_KEY = "sb_publishable_3p9i9j7fe7ZwIben7Oshlw_BwirUtoG";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const CATEGORIES = [
  { name: "Bands We Miss", desc: "Performers and groups who broke up or are no longer with us" },
  { name: "Best of the ’90s", desc: "Songs from high school" },
  { name: "Best of the ’00s", desc: "College highlights" },
  { name: "The Greatest Live Performances", desc: "You'd have done anything to have been there" },
  { name: "Dance Floor", desc: "Best songs to dance to" },
  { name: "Let It Out", desc: "Songs that get that emotion out" },
  { name: "Pump up Music", desc: "Your #1 song on the Pregame Playlist" },
  { name: "Suburban Milf Shake", desc: "The top beats to get suburban moms shaking their booties" },
  { name: "Bump and Grind", desc: "Videos that get us hot and bothered" },
  { name: "Wildcard", desc: "Anything goes. Read the room and add to the vibe" },
];

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
function token() {
  let t = store.get("mvs_token");
  if (!t) { t = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2)); store.set("mvs_token", t); }
  return t;
}
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.remove("hidden");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add("hidden"), 2600);
}
function parseYouTube(url) {
  url = (url || "").trim();
  let m = url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
const thumb = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const baseUrl = () => location.origin + location.pathname;
const guestUrl = (g = GAME) => baseUrl() + (g && !g.is_default ? "?g=" + encodeURIComponent(g.slug) : "");
function errMsg(e) { return (e && (e.message || e.error_description)) || "Something went wrong"; }
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }

// ---------- shared data ----------
const S = { games: [], teams: [], subs: [], rounds: {}, tallies: [], game: null, myVotes: {}, mySubs: new Set(), loaded: false, noGame: false };
let GAME = null; // the game this page is showing
function pickGame() {
  const def = S.games.find(g => g.is_default) || S.games[0] || null;
  if (isDJ()) return S.games.find(g => g.id === store.get("mvs_dj_game")) || def;
  const slug = new URLSearchParams(location.search).get("g");
  return slug ? S.games.find(g => g.slug === slug.toLowerCase()) || null : def;
}
async function loadAll() {
  const gq = await sb.from("games").select("id,slug,name,is_default,created_at").order("created_at");
  if (gq.error) throw gq.error;
  S.games = gq.data;
  const prev = GAME && GAME.id;
  GAME = pickGame();
  if (!GAME) { S.noGame = true; S.loaded = true; return; }
  S.noGame = false;
  if (prev && prev !== GAME.id) { S.myVotes = {}; S.mySubs = new Set(); }
  const gid = GAME.id;
  const [t, s, r, g, tal] = await Promise.all([
    sb.from("teams").select("id,name").eq("game_id", gid).order("name"),
    sb.from("submissions").select("id,team_id,category,url,video_id,title,created_at").eq("game_id", gid).order("created_at"),
    sb.from("rounds").select("category,status").eq("game_id", gid),
    sb.from("game_state").select("*").eq("game_id", gid).maybeSingle(),
    sb.rpc("get_tallies", { p_game: gid }),
  ]);
  for (const x of [t, s, r, g, tal]) if (x.error) throw x.error;
  S.teams = t.data; S.subs = s.data; S.game = g.data; S.tallies = tal.data || [];
  S.rounds = Object.fromEntries(r.data.map(x => [x.category, x.status]));
  S.loaded = true;
}
const teamName = id => (S.teams.find(t => t.id === id) || {}).name || "Unknown";
const subsIn = cat => S.subs.filter(s => s.category === cat);
const votesFor = id => { const r = S.tallies.find(x => x.submission_id === id); return r ? Number(r.votes) : 0; };

function rankRound(cat) {
  const list = subsIn(cat).map(s => ({ ...s, votes: votesFor(s.id) })).sort((a, b) => b.votes - a.votes);
  for (const s of list) {
    s.rank = 1 + list.filter(o => o.votes > s.votes).length;
    s.points = s.votes > 0 ? (s.rank === 1 ? 3 : s.rank === 2 ? 1 : 0) : 0;
  }
  return list;
}
function scoreboard() {
  const pts = Object.fromEntries(S.teams.map(t => [t.id, 0]));
  for (const c of CATEGORIES) if (S.rounds[c.name] === "closed") for (const s of rankRound(c.name)) if (s.points) pts[s.team_id] = (pts[s.team_id] || 0) + s.points;
  const rows = S.teams.map(t => ({ name: t.name, id: t.id, pts: pts[t.id] || 0 })).sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
  for (const r of rows) r.rank = 1 + rows.filter(o => o.pts > r.pts).length;
  return rows;
}
function scoreRows(rows) {
  if (!rows.length) return `<p class="muted">No teams yet.</p>`;
  return rows.map(r => `<div class="score-row ${r.rank === 1 && r.pts > 0 ? "first" : ""}"><span class="rank">${r.rank}</span><span class="grow">${esc(r.name)}</span><span class="pts">${r.pts}</span></div>`).join("");
}

// =====================================================================
// GUEST
// =====================================================================
const G = { tab: "add", pendingId: null, pendingTitle: "", busy: false, lastPhaseKey: "" };

const teamKey = () => "mvs_team_" + (GAME ? GAME.id : "");
function guestTeam() {
  const raw = store.get(teamKey()); if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

function renderGuest() {
  const app = $("#app");
  const brand = `<div class="brand"><img class="logo" src="favicon.svg" alt=""><div><h1>Music Video Showdown</h1><div class="sub">${esc(GAME ? GAME.name : "")}</div></div></div>`;
  if (!S.loaded) { app.innerHTML = `<div class="wrap">${brand}<p class="muted">Loading…</p></div>`; return; }
  if (S.noGame) { app.innerHTML = `<div class="wrap">${brand}<div class="empty card"><div class="big">🤷</div><h2 style="font-size:22px;margin:8px 0">Game not found</h2><p class="muted">Check the link with your host, or <a href="${esc(baseUrl())}">go to the main game</a>.</p></div></div>`; return; }
  const team = guestTeam();
  if (!team || !S.teams.some(t => t.id === team.id)) { renderJoin(brand); return; }

  const g = S.game || {};
  const votingCat = Object.keys(S.rounds).find(c => S.rounds[c] === "voting");
  const tabs = `<nav class="tabs">
    <button data-tab="add" class="${G.tab === "add" ? "on" : ""}">➕ Add songs</button>
    <button data-tab="vote" class="${G.tab === "vote" ? "on" : ""}">🗳️ Vote${votingCat ? '<span class="dot"></span>' : ""}</button>
    <button data-tab="scores" class="${G.tab === "scores" ? "on" : ""}">🏆 Scores</button></nav>`;

  let body = "";
  if (G.tab === "add") body = guestAdd();
  else if (G.tab === "vote") body = guestVote(votingCat, g);
  else body = `<h2 style="font-size:24px;margin-bottom:14px">Scoreboard</h2>${scoreRows(scoreboard())}<p class="muted small" style="margin-top:14px">1st place in a round = 3 points, 2nd = 1 point.</p>`;

  const keepInput = G.tab === "add" ? { url: $("#url")?.value, cat: $("#cat")?.value, title: $("#title")?.value } : null;
  const focusId = document.activeElement?.id;
  app.innerHTML = `<div class="wrap">${brand}
    <div class="row small muted" style="margin:-8px 0 16px">Playing as&nbsp;<b style="color:var(--text)">${esc(team.name)}</b><button class="btn-ghost btn-sm" id="switchTeam" style="margin-left:auto">Switch</button></div>
    ${body}</div>${tabs}`;
  if (keepInput) {
    if (keepInput.url != null) $("#url").value = keepInput.url;
    if (keepInput.cat) $("#cat").value = keepInput.cat;
    if (keepInput.title != null && $("#title")) $("#title").value = keepInput.title;
    if (focusId && $("#" + focusId)) $("#" + focusId).focus();
  }
  bindGuest();
}

function setTeam(id) { store.set(teamKey(), JSON.stringify({ id, name: teamName(id) })); renderGuest(); }

function guestAdd() {
  const opts = CATEGORIES.map(c => `<option value="${esc(c.name)}">${esc(c.name)} (${subsIn(c.name).length})</option>`).join("");

function guestVote(cat, g) {
  if (!cat) {
    const msg = g.phase === "playing" && g.current_category
      ? `Now playing: <b>${esc(g.current_category)}</b>. Voting opens when the round's videos are done.`
      : "Voting opens after each round. Keep this page open.";
    return `<div class="empty card"><div class="big">📺</div><h2 style="font-size:22px;margin:8px 0">Waiting for the DJ</h2><p class="muted">${msg}</p></div>`;
  }
  const list = subsIn(cat);
  const picked = S.myVotes[cat];
  return `<div class="card" style="margin-bottom:14px"><span class="badge live">VOTING OPEN</span><h2 style="font-size:24px;margin-top:8px">${esc(cat)}</h2><p class="muted small" style="margin:4px 0 0">Tap your favorite. You can change it until the DJ closes voting.</p></div>
    ${list.map(s => `<button class="item ${picked === s.id ? "picked" : ""}" data-vote="${s.id}"><img class="thumb" src="${thumb(s.video_id)}" alt=""><div class="grow"><div class="t">${esc(s.title)}</div></div><span class="check">${picked === s.id ? "✓" : ""}</span></button>`).join("")}`;
}

function bindGuest() {
  document.querySelectorAll(".tabs [data-tab]").forEach(b => b.onclick = () => { G.tab = b.dataset.tab; renderGuest(); window.scrollTo(0, 0); });
  $("#switchTeam").onclick = () => { store.del(teamKey()); renderGuest(); };
  document.querySelectorAll("[data-vote]").forEach(b => b.onclick = async () => {
    const id = b.dataset.vote; const sub = S.subs.find(s => s.id === id);
    S.myVotes[sub.category] = id; renderGuest();
    try { await rpc("cast_vote", { p_token: token(), p_submission: id }); toast("Vote locked in 🍻"); } catch (e) { toast(errMsg(e)); refresh(); }
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this video?")) return;
    try { await rpc("delete_my_submission", { p_token: token(), p_id: b.dataset.del }); S.mySubs.delete(b.dataset.del); await refresh(); toast("Removed"); } catch (e) { toast(errMsg(e)); }
  });
  const cat = $("#cat");
  if (cat) {
    const lastCat = store.get("mvs_last_cat"); if (lastCat && !cat.dataset.touched && CATEGORIES.some(c => c.name === lastCat) && !$("#url").value) cat.value = lastCat;
    const showDesc = () => { $("#catDesc").textContent = (CATEGORIES.find(c => c.name === cat.value) || {}).desc || ""; };
    showDesc(); cat.onchange = () => { store.set("mvs_last_cat", cat.value); showDesc(); };
    const url = $("#url");
    url.oninput = () => onUrl(url.value);
    if (url.value) onUrl(url.value, true);
    $("#addBtn").onclick = addSong;
  }
}

async function onUrl(val, silent) {
  const id = parseYouTube(val);
  const box = $("#previewBox"); const btn = $("#addBtn");
  if (!id) { G.pendingId = null; box.innerHTML = val.trim() ? `<p class="small" style="color:var(--red);margin-top:8px">That doesn't look like a YouTube link.</p>` : ""; btn.disabled = true; return; }
  if (id === G.pendingId && $("#title")) { btn.disabled = false; return; }
  G.pendingId = id;
  box.innerHTML = `<div class="preview"><img class="thumb" src="${thumb(id)}" alt=""><div class="grow muted small">Looking up the title…</div></div>`;
  let title = "";
  try {
    const r = await fetch(`https://noembed.com/embed?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + id)}`);
    const j = await r.json(); title = j.title || "";
  } catch {}
  if (G.pendingId !== id) return;
  box.innerHTML = `<div class="preview"><img class="thumb" src="${thumb(id)}" alt=""><div class="grow"><label for="title" style="margin-top:0">Song & artist</label><input id="title" maxlength="200" value="${esc(title)}" placeholder="Song – Artist"></div></div>`;
  btn.disabled = false;
}

async function addSong() {
  const id = G.pendingId; const title = ($("#title")?.value || "").trim(); const cat = $("#cat").value;
  if (!id) return toast("Paste a YouTube link first");
  if (!title) return toast("Add the song name");
  if (S.subs.some(s => s.category === cat && s.video_id === id)) return toast("That video is already in this category");
  const btn = $("#addBtn"); btn.disabled = true;
  document.activeElement?.blur();
  try {
    const newId = await rpc("add_submission", { p_token: token(), p_team: guestTeam().id, p_category: cat, p_url: $("#url").value.trim().slice(0, 300), p_video_id: id, p_title: title });
    S.mySubs.add(newId); store.set("mvs_last_cat", cat);
    $("#url").value = ""; G.pendingId = null; $("#previewBox").innerHTML = "";
    await refresh(); toast(`Added to ${cat} 🎬`);
  } catch (e) { toast(errMsg(e)); btn.disabled = false; }
}

async function loadMine() {
  try {
    if (!GAME) return;
    const [ids, votes] = await Promise.all([rpc("my_submissions", { p_token: token() }), rpc("my_votes", { p_token: token(), p_game: GAME.id })]);
    S.mySubs = new Set(ids || []);
    S.myVotes = Object.fromEntries((votes || []).map(v => [v.category, v.submission_id]));
  } catch {}
}

const D = { pin: store.get("mvs_pin"), cat: CATEGORIES[0].name, played: new Set(JSON.parse(store.get("mvs_played") || "[]")), showPickers: false, playing: null, startedAt: 0, screen: null };

function renderDJ() {
  const app = $("#app");
  if (!D.pin) {
    app.innerHTML = `<div class="wrap"><div class="brand"><img class="logo" src="favicon.svg" alt=""><div><h1>DJ booth</h1><div class="sub">Music Video Showdown</div></div></div>
      <div class="card"><label for="pin" style="margin-top:0">DJ PIN</label><input id="pin" inputmode="numeric" type="password" autocomplete="off"><button class="btn-gold" id="pinBtn" style="width:100%;margin-top:12px">Enter</button></div></div>`;
    $("#pinBtn").onclick = async () => { const p = $("#pin").value.trim(); try { await rpc("host_login", { p_pin: p }); D.pin = p; store.set("mvs_pin", p); renderDJ(); } catch { toast("Wrong PIN"); } };
    $("#pin").onkeydown = e => { if (e.key === "Enter") $("#pinBtn").click(); };
    return;
  }
  if (!S.loaded) { app.innerHTML = `<div class="wrap"><p class="muted">Loading…</p></div>`; return; }
  if (D.playing) return; // don't redraw under the video

  const gameOpts = S.games.map(g => `<option value="${g.id}" ${g.id === GAME.id ? "selected" : ""}>${g.is_default ? "★ " : ""}${esc(g.name)}</option>`).join("");
  const gameBox = `<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)">

      <select id="gameSel">${gameOpts}</select>
      <div class="small" style="margin-top:8px">${GAME.is_default ? `<span class="badge done">★ Default</span> <span class="muted">opens from the main link</span>` : `<span class="badge" style="background:rgba(78,163,255,.15);color:var(--blue)">Not the default</span> <span class="muted">has its own link</span>`}</div>
      <div class="toolbar" style="margin-top:10px"><button class="btn-ghost btn-sm" id="copyLink">🔗 Copy guest link</button><button class="btn-ghost btn-sm" id="newGame">+ New game</button></div>

    return `<button class="catbtn ${D.cat === c.name ? "on" : ""}" data-cat="${esc(c.name)}"><span>${esc(c.name)}</span>${badge}</button>`;
  }).join("");

  const cat = D.cat; const list = subsIn(cat); const st = S.rounds[cat];
  const cards = list.map((s, i) => `<div class="vcard ${D.played.has(s.id) ? "played" : ""}">
      <img src="${thumb(s.video_id)}" alt="">
      <div class="body"><div class="t">${i + 1}. ${esc(s.title)}</div>
        ${D.showPickers ? `<div class="small" style="color:var(--gold)">${esc(teamName(s.team_id))}</div>` : ""}
        ${st === "closed" || st === "voting" ? `<div class="small muted">${votesFor(s.id)} vote${votesFor(s.id) === 1 ? "" : "s"}</div>` : ""}
        <div class="toolbar" style="margin-top:auto"><button class="btn-gold btn-sm" data-play="${s.id}">▶ Play</button>
          <select class="btn-sm" data-move="${s.id}" style="width:auto;padding:6px 8px;font-size:13px"><option value="">Move…</option>${CATEGORIES.filter(c => c.name !== cat).map(c => `<option>${esc(c.name)}</option>`).join("")}</select>
          <button class="btn-ghost btn-sm" data-rm="${s.id}" title="Delete">🗑</button></div></div></div>`).join("");

  let roundBtns = "";
  if (!st) roundBtns = `<button class="btn-gold" id="openVote" ${list.length < 2 ? "disabled" : ""}>🗳️ Open voting</button>`;
  else if (st === "voting") roundBtns = `<button class="btn-ghost" id="showVote">Show voting screen</button><button class="btn-gold" id="closeVote">Close voting & reveal</button>`;
  else roundBtns = `<button class="btn-gold" id="showResults">Show results</button><button class="btn-ghost" id="reopen">Reopen voting</button><button class="btn-red btn-sm" id="resetRound">Reset round</button>`;

  app.innerHTML = `<div class="dj">
    <aside class="side">
      <div class="brand" style="margin-top:0"><img class="logo" src="favicon.svg" alt=""><div><h1 style="font-size:19px">DJ booth</h1><div class="sub">${S.subs.length} videos · ${S.teams.length} teams</div></div></div>
      ${gameBox}
      ${side}
      <div style="border-top:1px solid var(--line);margin:14px 0;padding-top:14px;display:grid;gap:8px">
        <button class="btn-gold" id="scoresBtn">🏆 Scoreboard on TV</button>
        <button class="btn-ghost" id="qrBtn">📱 Join QR code on TV</button>
        <label style="display:flex;gap:8px;align-items:center;margin:4px 0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)"><input type="checkbox" id="pickers" style="width:auto" ${D.showPickers ? "checked" : ""}> Show who picked each video</label>
        <button class="btn-ghost btn-sm" id="teamsBtn">Manage game & teams</button>
        <button class="btn-ghost btn-sm" id="logout">Sign out of DJ</button>
      </div>
    </aside>
    <main class="main">
      <div class="row" style="flex-wrap:wrap;gap:14px"><div class="grow"><div class="muted small" style="text-transform:uppercase;letter-spacing:.1em;font-weight:700">Category</div><h2 style="font-size:34px">${esc(cat)}</h2><div class="muted">${esc((CATEGORIES.find(c => c.name === cat) || {}).desc || "")}</div></div>
        <div class="toolbar">${roundBtns}</div></div>
      ${list.length < 4 ? `<p class="small" style="color:var(--gold);margin-top:12px">${list.length} of 4+ videos submitted.</p>` : ""}

function bindDJ() {
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { D.cat = b.dataset.cat; renderDJ(); });
  document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => playVideo(b.dataset.play));
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => { if (!confirm("Delete this video from the game?")) return; await hostCall("host_delete_submission", { p_id: b.dataset.rm }); });
  document.querySelectorAll("[data-move]").forEach(s => s.onchange = async () => { if (s.value) await hostCall("host_move_submission", { p_id: s.dataset.move, p_category: s.value }); });
  $("#pickers").onchange = e => { D.showPickers = e.target.checked; renderDJ(); };
  $("#logout").onclick = () => { store.del("mvs_pin"); D.pin = null; renderDJ(); };
  $("#scoresBtn").onclick = () => { D.screen = "scoreboard"; setPhase("scoreboard", null); drawScreen(); };
  $("#qrBtn").onclick = () => { D.screen = "join"; drawScreen(); };
  $("#teamsBtn").onclick = manageTeams;
  $("#gameSel").onchange = e => switchGame(e.target.value);
  $("#newGame").onclick = newGame;
  $("#copyLink").onclick = async () => {
    const url = guestUrl();
    try { await navigator.clipboard.writeText(url); toast("Copied: " + url.replace(/^https?:\/\//, "")); }
    catch { prompt("Guest link for " + GAME.name, url); }
  };
  const on = (id, fn) => { const el = $("#" + id); if (el) el.onclick = fn; };
  on("openVote", async () => { await hostCall("host_set_round", { p_category: D.cat, p_status: "voting" }); await setPhase("voting", D.cat); D.screen = "vote"; drawScreen(); });
  on("showVote", () => { D.screen = "vote"; drawScreen(); });
  on("closeVote", async () => { await hostCall("host_set_round", { p_category: D.cat, p_status: "closed" }); await setPhase("results", D.cat); D.screen = "results"; drawScreen(); });
  on("showResults", async () => { await setPhase("results", D.cat); D.screen = "results"; drawScreen(); });
  on("reopen", async () => { await hostCall("host_set_round", { p_category: D.cat, p_status: "voting" }); await setPhase("voting", D.cat); D.screen = "vote"; drawScreen(); });
  on("resetRound", async () => { if (!confirm(`Clear all votes for ${D.cat} and start the round over?`)) return; await hostCall("host_set_round", { p_category: D.cat, p_status: null }); });
}

async function switchGame(id) {
  store.set("mvs_dj_game", id); D.cat = CATEGORIES[0].name; D.screen = null; $("#screen")?.remove();
  document.activeElement?.blur(); lastSnap = "";
  S.loaded = false; renderDJ(); await refresh();
  toast("Switched to " + GAME.name);
}
async function newGame() {
  const name = prompt("Name the new game (e.g. \"Test run\" or \"Oktoberfest 2027\")");
  if (!name || !name.trim()) return;
  try { const id = await rpc("host_create_game", { p_pin: D.pin, p_name: name.trim() }); await switchGame(id); }
  catch (e) { toast(errMsg(e)); }
}
async function hostCall(fn, args) {
  document.activeElement?.blur(); // e.g. the "Move…" dropdown, so the result can redraw
  const needsGame = ["host_set_round", "host_reset_game", "host_set_default_game", "host_delete_game", "host_rename_game"].includes(fn);
  try { await rpc(fn, { p_pin: D.pin, ...(needsGame ? { p_game: GAME.id } : {}), ...args }); await refresh(); return true; }
  catch (e) { toast(errMsg(e)); if (/PIN/i.test(errMsg(e))) { store.del("mvs_pin"); D.pin = null; renderDJ(); } return false; }
}
async function setPhase(phase, cat, nowPlaying = null) {
  try { await rpc("host_set_state", { p_pin: D.pin, p_game: GAME.id, p_category: cat, p_phase: phase, p_now_playing: nowPlaying }); } catch (e) { toast(errMsg(e)); }
}

function playVideo(id) {
  const s = S.subs.find(x => x.id === id); if (!s) return;
  D.playing = id; D.startedAt = Date.now(); D.played.add(id); store.set("mvs_played", JSON.stringify([...D.played]));
  setPhase("playing", s.category, id);
  const list = subsIn(s.category); const idx = list.findIndex(x => x.id === id);
  const el = document.createElement("div"); el.className = "stage"; el.id = "stage";
  el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${s.video_id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
    <div class="stagebar"><span class="muted small">${esc(s.category)} · ${idx + 1} of ${list.length}</span><span id="timer" class="display" style="margin-left:12px;font-size:20px">0:00</span>
      <span class="grow"></span>
      <a class="btn-ghost btn-sm" style="text-decoration:none;color:var(--text);border-radius:9px" href="https://www.youtube.com/watch?v=${s.video_id}" target="_blank" rel="noopener">Won't play? Open on YouTube ↗</a>
      <button class="btn-ghost btn-sm" id="fsBtn">⛶ Fullscreen</button>
      ${idx < list.length - 1 ? `<button class="btn-gold btn-sm" id="nextBtn">Next video ▶</button>` : `<button class="btn-gold btn-sm" id="doneBtn">Done → open voting</button>`}
      <button class="btn-sm" id="stopBtn">✕ Stop</button></div>`;
  document.body.appendChild(el);
  clearInterval(D.timer);
  D.timer = setInterval(() => { const t = Math.floor((Date.now() - D.startedAt) / 1000); const tm = $("#timer"); if (tm) { tm.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; tm.style.color = t >= 90 ? "var(--red)" : t >= 60 ? "var(--gold)" : ""; } }, 500);
  const stop = () => { clearInterval(D.timer); el.remove(); D.playing = null; renderDJ(); };
  $("#stopBtn").onclick = () => { stop(); setPhase("idle", s.category); };
  $("#fsBtn").onclick = () => { (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); };
  if ($("#nextBtn")) $("#nextBtn").onclick = () => { clearInterval(D.timer); el.remove(); D.playing = null; playVideo(list[idx + 1].id); };
  if ($("#doneBtn")) $("#doneBtn").onclick = async () => { stop(); D.cat = s.category; if (!S.rounds[s.category]) { $("#openVote")?.click(); } };
}

function drawScreen() {
  let el = $("#screen");
  if (!el) { el = document.createElement("div"); el.id = "screen"; el.className = "screen"; document.body.appendChild(el); }
  const close = `<button class="btn-ghost btn-sm screen-close" id="closeScreen">✕ Back to DJ booth</button>`;
  const qrSvg = () => { const q = qrcode(0, "M"); q.addData(guestUrl()); q.make(); return q.createSvgTag({ cellSize: 8, margin: 0, scalable: true }); };
  const prettyUrl = guestUrl().replace(/^https?:\/\//, "").replace(/\/$/, "");
  if (D.screen === "join") {
    el.innerHTML = `${close}<div class="vote-layout"><div class="qr">${qrSvg()}</div><div><div class="kicker">Music Video Showdown</div><h2>Scan to add your songs & vote</h2><p class="muted" style="font-size:clamp(16px,1.8vw,26px);margin-top:2vh">${esc(prettyUrl)}</p></div></div>`;
  } else if (D.screen === "vote") {
    const cat = D.cat; const list = subsIn(cat); const total = list.reduce((n, s) => n + votesFor(s.id), 0);
    el.innerHTML = `${close}<div class="kicker">Voting is open · ${esc(cat)}</div><h2 style="margin-bottom:3vh">Pick your favorite</h2>
      <div class="vote-layout"><div class="qr">${qrSvg()}</div>
      <div><div class="bignum">${total}</div><div class="display" style="font-size:clamp(20px,2.4vw,36px)">vote${total === 1 ? "" : "s"} in</div>
        <p class="muted" style="font-size:clamp(15px,1.6vw,24px);margin-top:3vh">Scan or open <b style="color:var(--text)">${esc(prettyUrl)}</b> and tap 🗳️ Vote</p>
        <button class="btn-gold" id="screenClose" style="margin-top:3vh;font-size:clamp(16px,1.6vw,22px)">Close voting & reveal</button></div></div>`;
    $("#screenClose").onclick = () => { el.remove(); D.screen = null; renderDJ(); $("#closeVote")?.click(); };
  } else if (D.screen === "results") {
    const ranked = rankRound(D.cat).filter(s => s.votes > 0);
    const top = ranked.filter(s => s.rank <= 2);
    el.innerHTML = `${close}<div class="kicker">Results · ${esc(D.cat)}</div><h2>And the winner is…</h2>
      <div class="podium">${top.length ? top.map(s => `<div class="pod ${s.rank === 1 ? "p1" : ""}"><div class="place">${s.rank === 1 ? "1st" : "2nd"}</div><img src="${thumb(s.video_id)}" alt=""><div><div class="t">${esc(s.title)}</div><div class="team">${esc(teamName(s.team_id))}</div><div class="muted">${s.votes} vote${s.votes === 1 ? "" : "s"}</div></div><div class="pts">+${s.points}</div></div>`).join("") : `<p class="muted" style="font-size:24px">No votes were cast.</p>`}</div>
      <div style="margin-top:4vh"><button class="btn-gold" id="toScores" style="font-size:clamp(16px,1.6vw,22px)">🏆 Show scoreboard</button></div>`;
    $("#toScores").onclick = () => { D.screen = "scoreboard"; setPhase("scoreboard", null); drawScreen(); };
  } else if (D.screen === "scoreboard") {
    const done = CATEGORIES.filter(c => S.rounds[c.name] === "closed").length;
    el.innerHTML = `${close}<div class="kicker">After ${done} round${done === 1 ? "" : "s"}</div><h2 style="margin-bottom:3vh">Scoreboard</h2><div style="max-width:900px">${scoreRows(scoreboard())}</div>`;
  }
  $("#closeScreen").onclick = () => { el.remove(); D.screen = null; renderDJ(); };
}

function manageTeams() {
  const el = document.createElement("div"); el.className = "screen"; el.id = "teamsScreen";
  const draw = () => {
    const others = S.games.filter(g => g.id !== GAME.id);
    el.innerHTML = `<button class="btn-ghost btn-sm screen-close" id="tClose">✕ Close</button>
      <div style="max-width:640px">
      <div class="kicker" style="color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px">Game</div>
      <h2 style="font-size:34px;margin-bottom:6px">${esc(GAME.name)}</h2>
      <p class="muted small" style="margin:0 0 12px">Guest link: <b style="color:var(--text)">${esc(guestUrl().replace(/^https?:\/\//, ""))}</b>${GAME.is_default ? " (the main link)" : ""}</p>
      <div class="toolbar">
        <button class="btn-ghost btn-sm" id="gRename">Rename</button>
        ${GAME.is_default ? "" : `<button class="btn-gold btn-sm" id="gDefault">★ Make this the default game</button>`}
      </div>
      <p class="muted small" style="margin-top:10px">The default game is what the main link opens. Every other game has its own link with <code>?g=</code> on the end, so tests never mix with the real party.</p>

      <h2 style="font-size:26px;margin:28px 0 12px">Teams</h2>
      ${S.teams.map(t => `<div class="score-row"><span class="grow">${esc(t.name)}</span><span class="muted small">${S.subs.filter(s => s.team_id === t.id).length} videos</span><button class="btn-red btn-sm" data-dt="${t.id}">Delete</button></div>`).join("") || '<p class="muted">No teams yet.</p>'}
      <p class="muted small" style="margin-top:12px">Deleting a team also deletes its videos. Use it to clean up duplicates.</p>

      <h2 style="font-size:26px;margin:28px 0 12px">Danger zone</h2>
      <div class="toolbar">
        <button class="btn-red btn-sm" id="resetAll">Clear this game's teams, videos & votes…</button>
        ${GAME.is_default ? "" : `<button class="btn-red btn-sm" id="gDelete">Delete this game…</button>`}
      </div>
      ${GAME.is_default && others.length ? `<p class="muted small" style="margin-top:8px">To delete this game, first make another game the default.</p>` : ""}
      </div>`;
    $("#tClose").onclick = () => { el.remove(); renderDJ(); };
    el.querySelectorAll("[data-dt]").forEach(b => b.onclick = async () => { if (!confirm(`Delete team "${teamName(b.dataset.dt)}" and all its videos?`)) return; await hostCall("host_delete_team", { p_id: b.dataset.dt }); draw(); });
    $("#resetAll").onclick = async () => { if (prompt(`This deletes ALL teams, videos and votes in "${GAME.name}". Type RESET to confirm.`) !== "RESET") return; await hostCall("host_reset_game", {}); draw(); };
    $("#gRename").onclick = async () => { const n = prompt("New name for this game", GAME.name); if (n && n.trim()) { await hostCall("host_rename_game", { p_name: n.trim() }); draw(); } };
    if ($("#gDefault")) $("#gDefault").onclick = async () => { if (!confirm(`Make "${GAME.name}" the default? The main link will open this game for everyone.`)) return; await hostCall("host_set_default_game", {}); draw(); };
    if ($("#gDelete")) $("#gDelete").onclick = async () => {
      if (prompt(`Permanently delete "${GAME.name}" and everything in it? Type DELETE to confirm.`) !== "DELETE") return;
      if (await hostCall("host_delete_game", {})) { el.remove(); store.del("mvs_dj_game"); await switchGame((S.games.find(g => g.is_default) || S.games[0]).id); }
    };
  };
  document.body.appendChild(el); draw();
}

// =====================================================================
// boot + polling
// =====================================================================
const isDJ = () => location.hash.replace("#", "").toLowerCase() === "dj";
let refreshing = false;
let lastSnap = "";
// Polling only redraws when the data actually changed, and never while someone
// has a dropdown open or is typing (a redraw would close the dropdown / steal the click).
const snapshot = () => JSON.stringify([GAME, S.games, S.teams, S.subs, S.rounds, S.tallies, S.game, S.myVotes, [...S.mySubs].sort(), S.noGame]);
function inUse() {
  const a = document.activeElement;
  return !!a && (a.tagName === "SELECT" || a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && !["checkbox", "radio", "button", "submit"].includes(a.type)));
}
async function refresh() {
  if (refreshing) return; refreshing = true;
  try {
    await loadAll();
    if (!isDJ()) await loadMine();
    const snap = snapshot();
    if (snap === lastSnap) return;   // nothing new: leave the page alone
    if (inUse()) return;             // try again on the next poll
    lastSnap = snap;
    render();
  } catch (e) { console.error(e); if (!S.loaded) $("#app").innerHTML = `<div class="wrap"><div class="card"><h2>Can't reach the game</h2><p class="muted">${esc(errMsg(e))}</p></div></div>`; }
  finally { refreshing = false; }
}
function render() {
  if (isDJ()) {
    if (D.screen && $("#screen")) { drawScreen(); return; }
    if ($("#teamsScreen")) return;
    renderDJ();
  } else {
    // auto-jump to the vote tab when a round opens
    const votingCat = Object.keys(S.rounds).find(c => S.rounds[c] === "voting") || "";
    if (votingCat && votingCat !== G.lastPhaseKey && guestTeam()) G.tab = "vote";
    G.lastPhaseKey = votingCat;
    renderGuest();
  }
}
window.addEventListener("hashchange", () => { $("#screen")?.remove(); D.screen = null; S.loaded = false; lastSnap = ""; render(); refresh(); });
render(); refresh();
setInterval(() => { if (!document.hidden) refresh(); }, isDJ() ? 2000 : 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
